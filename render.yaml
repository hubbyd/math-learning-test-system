services:
  - type: web
    name: math-learning-test-system
    runtime: python
    plan: free
    rootDir: mathsystem
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: WEB_CONCURRENCY
        value: "1"
