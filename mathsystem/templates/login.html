{% extends "base.html" %}
{% block title %}登录 - 高等数学学习、测试系统{% endblock %}
{% block content %}
<div class="form-box">
  <h2>用户登录</h2>
  <form method="post">
    <label>用户名</label>
    <input type="text" name="username" required autofocus>
    <label>密码</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn primary">登录</button>
  </form>
  <p class="tip">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
  <p class="tip small">测试账号：admin/admin123（管理员）、teacher/teacher123（教师）、student/student123（学生）</p>
</div>
{% endblock %}
