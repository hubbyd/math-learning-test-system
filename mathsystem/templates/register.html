{% extends "base.html" %}
{% block title %}注册 - 高等数学学习、测试系统{% endblock %}
{% block content %}
<div class="form-box">
  <h2>用户注册</h2>
  <form method="post">
    <label>用户名（3~20 位字母、数字或下划线）</label>
    <input type="text" name="username" required>
    <label>密码（不少于 6 位）</label>
    <input type="password" name="password" required>
    <label>姓名</label>
    <input type="text" name="real_name">
    <label>角色</label>
    <select name="role">
      <option value="student">学生</option>
      <option value="teacher">教师</option>
    </select>
    <button type="submit" class="btn primary">注册</button>
  </form>
  <p class="tip">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
</div>
{% endblock %}
